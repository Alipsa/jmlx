# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# Configuration cache is off, not just unset: with it on, this multi-module build hits
# diffplug/spotless#2850 -- google-java-format throws NoClassDefFoundError (Guava classes that
# are genuinely on the classpath) on JDK 21/25, intermittently, specifically under config-cache
# reuse. Reproduced locally on this repo; --no-configuration-cache was the workaround before this
# was pinned off at the source. Re-enable once that issue is fixed upstream.
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.caching=true

