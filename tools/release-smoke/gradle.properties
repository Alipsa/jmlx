# The published coordinates the consumer must resolve, per profile. Full profile: all seven
# coordinates; pure-java profile: jinja, tokenizer and vision (see settings.gradle's selection).
#
# Version selection per mode (see repositories.gradle):
#   ci        these defaults, overridable with -P (run.sh forwards JMLX_*_VERSION)
#   release   full profile: these defaults with -SNAPSHOT stripped; pure-java profile: these
#             defaults are ignored entirely and the committed released-8.1.properties is the sole
#             source, an override may only repeat a file value exactly, and there is no
#             snapshot-suffix fallback.
# A PR that changes a pure-Java producer version must update the matching default here in the
# same change, so both CI consumers stay aligned with the locally published producers.
jmlxModelsVersion=0.1.0-SNAPSHOT
jmlxNativeVersion=0.1.0-SNAPSHOT
jmlxCoreVersion=0.5.0-SNAPSHOT
jmlxFfiVersion=0.5.0-SNAPSHOT
jmlxTokenizerVersion=0.1.2-SNAPSHOT
jmlxJinjaVersion=0.6.2-SNAPSHOT
jmlxVisionVersion=0.1.2-SNAPSHOT
org.gradle.warning.mode=summary
