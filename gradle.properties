# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

# google-java-format-*.jar's own manifest declares this Add-Exports set (needed by Spotless's
# removeUnusedImports() step, which links against javac's internal doctree/tree classes to resolve
# {@link} references) -- but a manifest Add-Exports entry only self-applies under `java -jar`, not
# when the jar sits on the classpath of an already-running JVM like the Gradle daemon. Without this,
# removeUnusedImports() throws NoClassDefFoundError the first time it scans javadoc containing
# {@link}/{@see} tags, which then poisons that class for every other file in the same build.
org.gradle.jvmargs=--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

