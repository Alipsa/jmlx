# One workflow coordinates the non-native and native checks. The pure-Java job
# covers jmlx-jinja/jmlx-tokenizer and their Node-oracle verification; the
# macOS job covers the MLX-dependent modules. Keeping them separate jobs avoids
# repeating the Jinja suite on the expensive macOS ARM64 runner.
#
# The Node-dependent tasks (see jmlx-jinja/build.gradle's nodeDependentTasks list) require the
# exact Node version pinned in jmlx-jinja/upstream/upstream-lock.json and are not wired into
# `check` for that reason; this workflow is what actually runs them, since jmlx-jinja was
# migrated from the archived standalone hfjinja repo where they ran in its own CI.
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tier_b:
        description: Run the pinned public Tier B artifact probe
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tier_b_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.tier_b
    uses: ./.github/workflows/tier-b.yml

  java:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
        -Dorg.gradle.java.installations.auto-download=false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # node-version-file rather than a literal: jmlx-jinja/.nvmrc is the same file a
      # developer's `nvm use` reads, so CI and local runs cannot drift apart. Its value is
      # still checked against upstream/upstream-lock.json's nodeVersion by nodeOracleVersion.
      - uses: actions/setup-node@v7
        with:
          node-version-file: jmlx-jinja/.nvmrc

      - uses: gradle/actions/setup-gradle@v6

      - name: Install hash-locked tokenizer oracle
        run: ./tools/tokenizer-oracle/install.sh

      - name: Check shared build logic
        run: ./gradlew -p buildSrc check

      # Root `check` owns repository-wide verification (currently the generated MLX inventory).
      # Module checks below do not execute it, so invoke it explicitly rather than assuming a
      # module lifecycle task covers handwritten source across the repository.
      - name: Run root verification
        run: ./gradlew :check

      # Configuration cache is off repo-wide (see gradle.properties) because of
      # diffplug/spotless#2850, so no --no-configuration-cache flag is needed here.
      - name: Run pure-Java modules and reference-oracle verification
        run: |
          ./gradlew \
            :jmlx-jinja:check \
            :jmlx-tokenizer:check \
            :jmlx-benchmarks:check \
            :jmlx-core:test \
            :jmlx-models:check \
            verifyTokenizerOracle \
            verifyTokenizerOracleFixtures \
            :jmlx-jinja:nodeCorpusTest \
            :jmlx-jinja:nodeOracleVersion \
            :jmlx-jinja:nodeCorpusVerify \
            :jmlx-jinja:corpusCoverage \
            :jmlx-jinja:astSnapshotVerify \
            :jmlx-jinja:fuzzParserTest \
            :jmlx-jinja:fuzzParserVerify \
            :jmlx-jinja:formatGoldenVerify

  native:
    # macos-26 is GitHub's hosted ARM64 (M1) image. Each job starts on a
    # fresh VM, so the pinned MLX runtime must be bootstrapped in the checkout.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v6

      - name: Bootstrap pinned MLX runtime
        shell: bash
        run: ./scripts/bootstrap-native.sh

      - name: Install hash-locked Python MLX oracle
        shell: bash
        run: ./tools/mlx-oracle/install.sh

      - name: Run root verification
        # Runs the repository-wide source guards after native bootstrap and oracle setup.
        run: ./gradlew :check verifyMlxApiHeaderCoverage verifyMlxOracle verifyMlxOracleFixtures -PmlxOracleRequireAllProfiles=true

      # The Java job already verifies jmlx-jinja/jmlx-tokenizer. Do not use
      # Gradle's build cache here: a cached test result would not demonstrate
      # that MLX tests executed on this Apple-Silicon runner.
      - name: Run native module checks
        run: ./gradlew --no-build-cache :jmlx-ffi:check :jmlx-core:check :jmlx-models:check :jmlx-examples:check :jmlx-native-macos-arm64:check :jmlx-ffi:assemble :jmlx-core:assemble :jmlx-models:assemble :jmlx-native-macos-arm64:assemble

      # Publishes the six SNAPSHOT modules to a disposable repository and resolves them from a clean
      # consumer (fresh GRADLE_USER_HOME, exclusive repository content, no checkout classpath, no
      # native path override). CI mode only: the release-mode and Central runs are manual.
      - name: Release smoke (CI mode)
        run: ./tools/release-smoke/run.sh ci

      - name: Assert required native suites executed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          suites = {
              'jmlx-core': ['DecoderAttentionTest', 'MoeMlpTest', 'SwitchGluTest', 'MoeRoutingProbeTest', 'RopeFreqsProbeTest',
                            'KVCacheTest', 'KVCacheMemoryPlateauTest',
                            'KVCacheQuantizationProbeTest', 'PackedAttentionProbeTest', 'AttentionMaskTest',
                            'GroupedQueryAttentionTest', 'MultiHeadAttentionTest',
                            'BatchAttentionMaskTest', 'BatchRopeProbeTest', 'StridedViewSafetyTest',
                            'Phase71OracleTest', 'Phase71DefaultModeTest', 'Phase71ContractsTest', 'EncoderAttentionTest'],
              'jmlx-models': ['DecoderRefactorGoldenTest', 'MistralModelTest', 'GemmaModelTest',
                              'Phi3ModelTest', 'MixtralModelTest', 'Llama31ModelTest', 'Qwen3ModelTest',
                              'QuantizedCheckpointProbeTest', 'QuantizedDecoderTest', 'DecoderCacheLifecycleTest',
                              'DecoderCacheCapacityTest', 'DecoderSlidingWindowTest',
                              'DecoderForwardPoisoningTest', 'QuantizedKvFeasibilityProbeTest',
                              'BatchGenerationSchedulerTest', 'BatchSchedulerFailureTest',
                              'BatchSchedulerLifecycleTest', 'BatchSchedulerMemoryTest',
                              'BatchStepEquivalenceTest', 'BertGoldenTest', 'T5GoldenTest', 'Seq2SeqMemoryTest', 'Seq2SeqGenerationTest', 'EncoderDefaultPrecisionTest'],
          }
          # Golden references run in their own full-float32 JVM. Batch equivalence must
          # execute in both precision modes. Probe (b) remains evidence only.
          float32_suites = ['DecoderRefactorGoldenTest', 'MistralModelTest', 'GemmaModelTest',
                            'Phi3ModelTest', 'MixtralModelTest', 'Llama31ModelTest',
                            'DecoderSlidingWindowTest', 'BertGoldenTest', 'T5GoldenTest']
          model_results = {name: ['float32GoldenTest'] for name in float32_suites}
          model_results['BatchStepEquivalenceTest'] = ['test', 'float32GoldenTest']
          model_results['WorkerStreamProbeTest'] = ['threadProbeTest']
          core_results = {name: ['test', 'float32GoldenTest'] for name in
                          ['DecoderAttentionTest', 'MultiHeadAttentionTest', 'MoeMlpTest', 'SwitchGluTest']}
          core_results['Phase71OracleTest'] = ['float32GoldenTest']
          core_results['EncoderAttentionTest'] = ['float32GoldenTest']
          results_dirs = {'jmlx-models': model_results, 'jmlx-core': core_results}
          suites['jmlx-models'].append('WorkerStreamProbeTest')
          for module, names in suites.items():
              for name in names:
                  for task in results_dirs.get(module, {}).get(name, ['test']):
                      root = Path(module) / 'build/test-results' / task
                      matches = list(root.glob(f'TEST-*.{name}.xml'))
                      if len(matches) != 1:
                          raise SystemExit(f'{module}/{task}/{name}: expected one result XML, found {len(matches)}')
                      result = ElementTree.parse(matches[0]).getroot()
                      tests = int(result.attrib['tests'])
                      skipped = int(result.attrib.get('skipped', 0))
                      if tests == 0 or skipped == tests:
                          raise SystemExit(f'{module}/{task}/{name}: native tests did not execute')
                      print(f'{module}/{task}/{name}: {tests - skipped}/{tests} executed')
          PY

      # Gate 0 probe (b): two threads use MLX concurrently. Evidence only -- a pass proves nothing
      # and it can crash its JVM, so it never gates. The step has an id so its outcome is recorded
      # even when a crash leaves no result XML.
      - name: Gate 0 probe (b) - concurrent MLX threads (evidence only)
        id: concurrent_stream_probe
        continue-on-error: true
        run: ./gradlew --no-build-cache :jmlx-models:concurrentStreamProbe

      - name: Record probe (b) outcome
        if: always()
        run: |
          echo "### Gate 0 probe (b): concurrent MLX threads" >> "$GITHUB_STEP_SUMMARY"
          echo "outcome: \`${{ steps.concurrent_stream_probe.outcome }}\` (evidence only, never gates)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe (b) result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrent-stream-probe
          path: jmlx-models/build/test-results/concurrentStreamProbe/
          if-no-files-found: warn

      - name: Upload native quantization probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv-cache-quantization-probe
          path: jmlx-core/build/test-results/test/TEST-se.alipsa.jmlx.nn.KVCacheQuantizationProbeTest.xml
          if-no-files-found: warn

      - name: Upload packed attention probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-attention-probe
          path: jmlx-core/build/test-results/test/TEST-se.alipsa.jmlx.nn.PackedAttentionProbeTest.xml
          if-no-files-found: warn

      - name: Upload quantized KV feasibility probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantized-kv-feasibility-probe
          path: jmlx-models/build/test-results/test/TEST-se.alipsa.jmlx.models.QuantizedKvFeasibilityProbeTest.xml
          if-no-files-found: warn

      - name: Smoke test decode benchmark JSON
        run: |
          ./gradlew :jmlx-examples:benchmarkDecode \
            --args="${PWD}/tools/hf-reference/goldens/checkpoints/llama ${PWD}/build/phase6-4-ci 1,2 2 1 0 full"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/phase6-4-ci.json').read_text())
          required = ('schema', 'checkpoint_sha256', 'cold_load_ns', 'prefill_ns',
                      'one_token_decode_ns', 'sustained_generation_ns',
                      'tokens_per_second_median', 'peak_generation_active_bytes',
                      'active_per_generated_token_bytes')
          missing = [field for field in required if field not in data]
          if missing or data['schema'] != 'jmlx-decode-benchmark-1':
              raise SystemExit(f'benchmark JSON invalid: missing={missing}')
          PY
