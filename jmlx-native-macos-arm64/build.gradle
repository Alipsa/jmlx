plugins {
    id 'java-library'
    id 'maven-publish'
}

// Independent of the root's 0.5.0-SNAPSHOT and of jmlx-core/jmlx-ffi's own version line -- see
// req/plans/native-artifact-packaging-plan.md. The real upstream pin (mlx-metal wheel version +
// mlx-c commit) travels inside the jar as native-pin.properties instead of in this version string,
// so this module's own SemVer stays independent of mlx-c's own independent versioning (already a
// distinct axis per AGENTS.md).
version = '0.1.0'

// This module has a small Java metadata API alongside its native payload. Native resources are added
// directly to the main jar below, rather than registered as source-set resources, so normal source
// and Javadoc companion jars contain only the genuine Java API and never duplicate the ~180MB payload.
java {
    withSourcesJar()
    withJavadocJar()
}

def stagedNativeDir = rootProject.layout.projectDirectory.dir('native/install/lib')
def resourceRoot = 'se/alipsa/jmlx/native/macos-aarch64'
def requiredFiles = ['libmlxc.dylib', 'libmlx.dylib', 'libjaccl.dylib', 'mlx.metallib', 'native-pin.properties']
def generatedResourcesDir = layout.buildDirectory.dir('generated/nativeResources')

// The 4 binaries + native-pin.properties only exist after a human/CI has run
// scripts/bootstrap-native.sh; this task must never re-invoke that script itself (it does
// long-running network/build work), but must also never silently produce an empty or partial jar
// if the files are missing.
//
// Deliberately NOT a Copy task: Copy/Sync are @SkipWhenEmpty on their source -- when
// stagedNativeDir is missing entirely (or empty), Gradle marks the task NO-SOURCE and skips it
// without ever running doFirst/doLast, so the missing-file check below would silently never fire.
// A plain task with a manual project.copy(...) call always executes its actions.
// Captured at configuration time, not referenced from `project` inside doLast: Task.project at
// execution time is deprecated (incompatible with the configuration cache).
def fileSystemOperations = project.services.get(org.gradle.api.file.FileSystemOperations)

// Every other module's native-dependent tests are SKIPPED, not failed, when native/install/lib
// isn't staged (see @EnabledIfNativeAvailable and AGENTS.md) so that ./gradlew build succeeds for
// a contributor who hasn't run bootstrap-native.sh and doesn't need native functionality. This
// module's own build must honor that same repo-wide invariant: gate staging on the same signal
// NativeLoader itself checks first (mlx.metallib's presence), so a totally unstaged checkout
// produces an empty jar (without failing the aggregate `build`/`check`) rather than breaking it.
// A *partially* staged directory (mlx.metallib present but something else missing -- a broken or
// interrupted bootstrap run) does not make a corrupt jar: staging removes any old generated
// resources and leaves a local jar empty. A missing pin alongside an otherwise old staged runtime
// is a migration case; rerunning bootstrap validates it and writes the completion marker.
def hasValidatedStagedNativeFiles = {
    requiredFiles.every { new File(stagedNativeDir.asFile, it).isFile() }
}

tasks.register('stageNativeResources') {
    group = 'build'
    description = "Stages the mlx-c/MLX binaries bootstrap-native.sh produced into this module's resources."
    def targetDir = generatedResourcesDir.map { it.dir(resourceRoot) }
    outputs.dir(targetDir)
    // inputs.files (not inputs.dir(stagedNativeDir)): that directory may not exist at all, and
    // a FileTree tolerates a missing root where inputs.dir does not. skipWhenEmpty(false) is the
    // same fix stageNativeResources already needed once (see the "Deliberately NOT a Copy task"
    // comment above): an empty/missing source must never make Gradle silently skip this task's
    // actions. In particular, an unstaged build must delete output from an earlier staged build.
    inputs.files(fileTree(stagedNativeDir) { include requiredFiles })
        .withPropertyName('stagedNativeFiles')
        .skipWhenEmpty(false)
    // If Gradle has no prior input snapshot (for example after a daemon restart), an existing
    // generated directory must still not survive an unstaged build as stale package input.
    outputs.upToDateWhen { hasValidatedStagedNativeFiles() || !targetDir.get().asFile.exists() }
    doLast {
        if (!hasValidatedStagedNativeFiles()) {
            fileSystemOperations.delete { delete targetDir }
            def metallib = new File(stagedNativeDir.asFile, 'mlx.metallib')
            def pin = new File(stagedNativeDir.asFile, 'native-pin.properties')
            def migrationHint = metallib.isFile() && !pin.isFile()
                    ? ' Existing runtime has no native-pin.properties; re-run ./scripts/bootstrap-native.sh to validate and re-stage it.'
                    : ''
            logger.warn(
                    'jmlx-native-macos-arm64: validated native staging not found -- run ' +
                    './scripts/bootstrap-native.sh to stage the native runtime, then rebuild this module ' +
                    "for a real jar. Removing stale staged resources; this module's jar will be empty." + migrationHint)
            return
        }
        fileSystemOperations.copy {
            from(stagedNativeDir) { include requiredFiles }
            into targetDir.get()
        }
        requiredFiles.each { name ->
            def f = new File(targetDir.get().asFile, name)
            if (!f.isFile() || f.length() == 0) {
                throw new GradleException("Staged resource ${name} is missing or empty after copy: ${f}")
            }
        }
        def pinProps = new Properties()
        new File(targetDir.get().asFile, 'native-pin.properties').withInputStream { pinProps.load(it) }
        ['mlxMetalVersion', 'mlxcCommit'].each { key ->
            def value = pinProps.getProperty(key)
            if (value == null || value.isBlank()) {
                throw new GradleException("native-pin.properties is missing a non-blank '${key}' entry")
            }
        }
    }
}

tasks.named('jar') {
    // `native` is a Java keyword and therefore cannot be a module-name segment.
    manifest.attributes('Automatic-Module-Name': 'se.alipsa.jmlx.nativelib.macosarm64')
    dependsOn tasks.named('stageNativeResources')
    from(generatedResourcesDir)
    // The root convention adds this main jar's LICENSE/NOTICE; companion jars are handled below.
}

tasks.withType(Jar).configureEach {
    from(['LICENSE-APACHE-2.0', 'LICENSE-CC-BY-SA-4.0']) { into 'META-INF' }
    from('THIRD-PARTY-NOTICES') { into 'META-INF' }
}
tasks.named('sourcesJar', Jar) {
    from(['LICENSE', 'NOTICE']) { into 'META-INF' }
}
tasks.named('javadocJar', Jar) {
    from(['LICENSE', 'NOTICE']) { into 'META-INF' }
}

// Task 2's doLast only checks immediately after copying; this re-verifies the actual published
// artifact (the built jar) has exactly the right entries on every check, independent of how the
// resources got there.
def metallibMinBytes = 100_000_000L // same floor as bootstrap-native.sh's own check

tasks.register('verifyPackagedNativeResources') {
    group = 'verification'
    description = 'Verifies the built jar contains exactly the expected native resources.'
    dependsOn tasks.named('jar')
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(jarFile)
    // stageNativeResources is an always-actionable task so it can remove stale output. This check's
    // own onlyIf is lenient instead: an intentionally-empty jar (native/install/lib never staged)
    // is not its business. It catches a jar that tried to package native resources and got it wrong.
    onlyIf { hasValidatedStagedNativeFiles() }
    doLast {
        def zip = new java.util.zip.ZipFile(jarFile.get().asFile)
        try {
            def entries = requiredFiles.collectEntries { name ->
                [(name): zip.getEntry("${resourceRoot}/${name}")]
            }
            def missing = entries.findAll { name, entry -> entry == null }.keySet()
            if (!missing.isEmpty()) {
                throw new GradleException("Packaged jar is missing native resources: ${missing}")
            }
            def empty = entries.findAll { name, entry -> entry.size <= 0 }.keySet()
            if (!empty.isEmpty()) {
                throw new GradleException("Packaged jar has empty native resources: ${empty}")
            }
            def metallibSize = entries['mlx.metallib'].size
            if (metallibSize < metallibMinBytes) {
                throw new GradleException(
                        "Packaged mlx.metallib is only ${metallibSize} bytes (expected >= ${metallibMinBytes})")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyPackagedNativeResources') }

// Explicit release verification: ordinary unstaged contributor builds retain no Python prerequisite.
tasks.register('verifyNativeReleasePayload', Exec) {
    group = 'verification'
    description = 'Checks packaged dylib deployment targets, source paths, pins and license texts.'
    dependsOn tasks.named('jar'), tasks.named('sourcesJar'), tasks.named('javadocJar')
    // Like verifyPackagedNativeResources: with native/install/lib unstaged there is no real
    // payload to check, and this Exec task's own failure (a python error or a missing bootstrap
    // script in a partial checkout) would otherwise preempt the publish task's unconditional
    // doFirst refusal -- the canonical message that tells the human to run bootstrap-native.sh.
    // Staging missing, the payload check is skipped and the publish refusal fires instead;
    // staging present but the payload wrong, this task still fails the release.
    onlyIf { hasValidatedStagedNativeFiles() }
    commandLine 'python3', rootProject.file('tools/release-all/release_inputs.py'), 'native',
            tasks.named('jar').get().archiveFile.get().asFile,
            '--documentation-jar', tasks.named('sourcesJar').get().archiveFile.get().asFile,
            '--documentation-jar', tasks.named('javadocJar').get().archiveFile.get().asFile,
            '--bootstrap', rootProject.file('scripts/bootstrap-native.sh'),
            '--forbid', System.getProperty('user.home'), '--forbid', rootProject.projectDir
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'jmlx-native-macos-arm64'
                description = 'Precompiled MLX/mlx-c native binaries for macOS on Apple Silicon (arm64), for jmlx-ffi\'s NativeLoader classpath-extraction fallback.'
                url = 'https://github.com/Alipsa/jmlx'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                    license {
                        name = 'Creative Commons Attribution-ShareAlike 4.0 International'
                        url = 'https://creativecommons.org/licenses/by-sa/4.0/'
                    }
                    license {
                        name = 'BSD 2-Clause License'
                        url = 'https://opensource.org/license/bsd-2-clause'
                    }
                    license {
                        name = 'BSD 3-Clause License'
                        url = 'https://opensource.org/license/bsd-3-clause'
                    }
                    license {
                        name = 'zlib License'
                        url = 'https://opensource.org/license/zlib'
                    }
                }
                withXml {
                    def entries = asNode().licenses[0].license
                    def requireLicense = { String name ->
                        def entry = entries.find { it.name.text() == name }
                        if (entry == null) {
                            throw new GradleException("Expected native POM license entry: ${name}")
                        }
                        entry
                    }
                    requireLicense('MIT License').appendNode('comments',
                            'Applies to the jmlx native artifact code, mlx-c, Apple/MLX contributions covered by their existing MIT grants, and the other MIT components listed in META-INF/THIRD-PARTY-NOTICES, including nlohmann/json, fmt, gguf-tools, FP16 and supervised-lda. MIT notices are also retained there for the opt_einsum algorithm attribution and VkFFT algorithm reference. The reviewed Juffa expression has separately identified CC BY-SA 4.0 terms.')
                    requireLicense('Apache License, Version 2.0').appendNode('comments',
                            'Applies to Apache-2.0 components identified in META-INF/THIRD-PARTY-NOTICES, including vendored metal-cpp compiled into libmlx.dylib and the NVIDIA/Filipe RNC Maia cexpf and TensorFlow adaptations. An Apache-2.0 notice is also retained there for the JAX Threefry algorithm reference.')
                    requireLicense('Creative Commons Attribution-ShareAlike 4.0 International').appendNode('comments',
                            'Applies to Norbert Juffa\'s covered expression in the reviewed Metal erf and Metal/CPU SIMD erfinv material, including corresponding compiled forms in libmlx.dylib and mlx.metallib. Apple/MLX contributions rely separately on existing MIT grants. No CC adapter\'s license is identified. See <https://github.com/Alipsa/jmlx/blob/551eebeeb66a80ef3af467a6c1b4995c2a7f7034/jmlx-native-macos-arm64/THIRD-PARTY-NOTICES> (scope and redistribution basis), also packaged in META-INF/THIRD-PARTY-NOTICES. The complete CC license is packaged in META-INF/LICENSE-CC-BY-SA-4.0.')
                    requireLicense('BSD 2-Clause License').appendNode('comments',
                            'Applies to BSD-2-Clause material identified in META-INF/THIRD-PARTY-NOTICES, including Norbert Juffa expm1f.')
                    requireLicense('BSD 3-Clause License').appendNode('comments',
                            'Applies to BSD-3-Clause components identified in META-INF/THIRD-PARTY-NOTICES, including pocketfft, V8, NumPy, fastermath and PyTorch (including Metal hypot). BSD-3-Clause notices are also retained there for the Random123 Threefry attribution and CUB merge-sort algorithm reference.')
                    requireLicense('zlib License').appendNode('comments',
                            'Applies to zlib components identified in META-INF/THIRD-PARTY-NOTICES, including ThreadPool and the Julien Pommier NEON math adaptation.')
                }
                developers {
                    developer {
                        id = 'pernyfelt'
                        name = 'Per Nyfelt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Alipsa/jmlx.git'
                    developerConnection = 'scm:git:ssh://git@github.com:Alipsa/jmlx.git'
                    url = 'https://github.com/Alipsa/jmlx'
                }
            }
        }
    }
}

// Explicit release-only history and POM checks; never part of ordinary check or PR CI.
tasks.register('verifyNativeReleaseLicenses', Exec) {
    group = 'verification'
    description = 'Verifies authored attribution, POM terms and immutable notice ancestry/freshness.'
    dependsOn tasks.named('generatePomFileForMavenPublication')
    dependsOn tasks.named('jar'), tasks.named('sourcesJar'), tasks.named('javadocJar')
    commandLine 'python3', rootProject.file('tools/release-all/release_inputs.py'), 'licenses',
            '--root', rootProject.projectDir,
            '--pom', layout.buildDirectory.file('publications/maven/pom-default.xml').get().asFile,
            '--jar', tasks.named('jar').get().archiveFile.get().asFile,
            '--jar', tasks.named('sourcesJar').get().archiveFile.get().asFile,
            '--jar', tasks.named('javadocJar').get().archiveFile.get().asFile
}

// stageNativeResources remains lenient by removing stale resources and producing an empty local jar
// in an unstaged checkout; verifyPackagedNativeResources skips its assertion in that case. Release
// depends on check, and a skipped verification is still passing: without a gate here, releasing from
// an unstaged checkout would silently publish an empty jar to Maven Central -- a mistake that,
// unlike a failed build, can never be taken back. Publishing must therefore use its own hard,
// unconditional gate rather than inheriting build-time leniency.
tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    if (!project.version.toString().endsWith('-SNAPSHOT')) {
        dependsOn tasks.named('verifyNativeReleasePayload')
    }
    doFirst {
        if (!hasValidatedStagedNativeFiles()) {
            throw new GradleException(
                    'Refusing to publish jmlx-native-macos-arm64 without staged native binaries -- ' +
                    'run ./scripts/bootstrap-native.sh first, then rebuild before publishing.')
        }
    }
}
