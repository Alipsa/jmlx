// Shared by app, pure-java and pom-check. The jmlx source is a parameter (-PjmlxRepoUrl): the
// disposable smoke repository in CI / release-candidate mode, Maven Central for the final
// release-mode run. exclusiveContent makes `se.alipsa` resolve ONLY from that source, and
// everything else (Jackson, the only external runtime dependency) ONLY from Central. No
// mavenLocal(), no substitution rules.
def jmlxRepoUrl = providers.gradleProperty('jmlxRepoUrl').orElse('https://repo.maven.apache.org/maven2/').get()
def pomOnly = project.hasProperty('pomOnlyResolution')

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'jmlx'
                url = uri(jmlxRepoUrl)
                if (pomOnly) {
                    // Resolve through the POM, as a Maven consumer would, instead of the .module file.
                    metadataSources {
                        mavenPom()
                        ignoreGradleMetadataRedirection()
                    }
                }
            }
        }
        filter { includeGroup 'se.alipsa' }
    }
    mavenCentral { content { excludeGroup 'se.alipsa' } }
}

def jmlxMode = providers.gradleProperty('jmlxMode').orElse('ci').get()
if (!(jmlxMode in ['ci', 'release'])) {
    throw new GradleException("jmlxMode must be 'ci' or 'release', not '${jmlxMode}'")
}
def profile = providers.gradleProperty('smokeProfile').getOrElse('all')
if (!(profile in ['all', 'pure-java'])) {
    throw new GradleException("smokeProfile must be 'all' or 'pure-java', not '${profile}'")
}

// The profile's selected modules are the ONLY coordinates this consumer resolves: the all profile
// keeps the seven-module native graph, the pure profile resolves jinja/tokenizer/vision only, so
// an unselected native version never needs to exist or be a release.
def allModules = ['jmlx-models', 'jmlx-native-macos-arm64', 'jmlx-core', 'jmlx-ffi',
                  'jmlx-tokenizer', 'jmlx-jinja', 'jmlx-vision', 'jmlx-spring-ai', 'jmlx-langchain4j']
def pureModules = ['jmlx-jinja', 'jmlx-tokenizer', 'jmlx-vision']
def selectedModules = profile == 'pure-java' ? pureModules : allModules

// Property keys per module, matching the consumer gradle.properties defaults.
def propertyKey = { String module ->
    switch (module) {
        case 'jmlx-spring-ai': return 'jmlxSpringAiVersion'
        case 'jmlx-langchain4j': return 'jmlxLangchain4jVersion'
        case 'jmlx-models': return 'jmlxModelsVersion'
        case 'jmlx-native-macos-arm64': return 'jmlxNativeVersion'
        case 'jmlx-core': return 'jmlxCoreVersion'
        case 'jmlx-ffi': return 'jmlxFfiVersion'
        case 'jmlx-tokenizer': return 'jmlxTokenizerVersion'
        case 'jmlx-jinja': return 'jmlxJinjaVersion'
        case 'jmlx-vision': return 'jmlxVisionVersion'
    }
    throw new GradleException("No version property key for module ${module}")
}

// The released pure-Java tuple: the sole version source for the pure profile in release mode.
// Parsed line by line (key=value, no whitespace), not with java.util.Properties: the shell
// preflight reads the same file with grep/cut, and the two parsers must agree on what a valid
// entry is. Properties silently strips the value's leading whitespace and keeps trailing
// whitespace, so a malformed hand edit could pass here while failing the preflight (or vice
// versa); any whitespace in the value is a clear error in both.
def tupleFile = new File(project.rootDir, 'released-8.1.properties')
def tupleVersions = null
if (profile == 'pure-java' && jmlxMode == 'release') {
    if (!tupleFile.isFile()) {
        throw new GradleException("The pure-Java release run requires the committed tuple file ${tupleFile}")
    }
    def raw = tupleFile.getText('UTF-8')
    // readLines() would strip carriage returns and silently accept a CRLF-rewritten file that
    // the shell preflight rejects; check the raw text so the two readers agree on line endings.
    if (raw.contains('\r')) {
        throw new GradleException(
            "released-8.1.properties must use LF line endings (no carriage returns); " +
            "a CRLF-rewritten checkout cannot be published from")
    }
    def lines = raw.split('\n')
    tupleVersions = [:]
    for (String module in pureModules) {
        def key = propertyKey(module)
        def line = lines.find { it.startsWith(key + '=') }
        if (line == null) {
            throw new GradleException("released-8.1.properties is missing required entry ${key}")
        }
        def value = line.substring(key.length() + 1)
        if (value ==~ /.*\s.*/) {
            throw new GradleException(
                "released-8.1.properties entry ${key} contains whitespace: '${value}'; " +
                "the file is tightly formatted (key=value lines, no whitespace)")
        }
        if (value.isEmpty()) {
            throw new GradleException("released-8.1.properties is missing required entry ${key}")
        }
        if (value.endsWith('-SNAPSHOT')) {
            throw new GradleException("released-8.1.properties entry ${key} must not be a snapshot: ${value}")
        }
        tupleVersions[module] = value
    }
}

def versionOf = { String module ->
    def key = propertyKey(module)
    def configured = providers.gradleProperty(key).get()
    if (tupleVersions != null) {
        // The committed tuple is the sole source: the gradle.properties defaults are ignored
        // entirely (no snapshot-suffix fallback), and an explicit -P override may only repeat the
        // file value exactly. This is checked here so a wrong override fails before any
        // resolution, and the consumer can never disguise a different or snapshot version.
        def fromTuple = tupleVersions[module]
        def override = gradle.startParameter.projectProperties.get(key)
        if (override != null && override != fromTuple) {
            throw new GradleException(
                "${key} override '${override}' disagrees with released-8.1.properties value '${fromTuple}'; " +
                "overrides may only repeat a file value exactly")
        }
        def source = override != null ? 'released-8.1.properties (override repeats it)' : 'released-8.1.properties'
        if (!pomOnly) {
            println "smoke version ${module}=${fromTuple} (${source})"
        }
        return fromTuple
    }
    def version = jmlxMode == 'release' ? configured.replace('-SNAPSHOT', '') : configured
    if (!pomOnly) {
        println "smoke version ${module}=${version} (gradle.properties default${jmlxMode == 'release' ? ', -SNAPSHOT stripped' : ''})"
    }
    return version
}

ext.jmlxMode = jmlxMode
ext.smokeProfile = profile
ext.jmlxRepoUrl = jmlxRepoUrl
ext.tupleFile = tupleFile
ext.jmlxVersions = selectedModules.collectEntries { module -> [(module): versionOf(module)] }
