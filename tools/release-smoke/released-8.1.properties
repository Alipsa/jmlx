# The committed released pure-Java tuple for the Phase 8.1 release (jinja, tokenizer, vision).
#
# In release mode (-PjmlxMode=release) with --profile pure-java, this file is the SOLE source of
# the consumer's expected versions, for both the local candidate run and the Central run. There
# is no fallback to the gradle.properties defaults below in tools/release-smoke and no
# -SNAPSHOT-stripping of producer versions: a missing entry, a snapshot value, or an override that
