import groovy.json.JsonOutput
import org.gradle.api.Plugin
import org.gradle.api.Project
import org.gradle.api.GradleException
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters
import org.gradle.build.event.BuildEventsListenerRegistry
import org.gradle.tooling.events.FinishEvent
import org.gradle.tooling.events.OperationCompletionListener
import org.gradle.tooling.events.task.TaskFinishEvent
import org.gradle.tooling.events.task.TaskSuccessResult
import org.gradle.tooling.events.task.TaskSkippedResult
import org.gradle.tooling.events.task.TaskFailureResult
import javax.inject.Inject

// Explicit producer-side collector. Consumers never inherit this init script.
abstract class ReleaseTaskEvidence implements BuildService<ReleaseTaskEvidence.Params>,
        OperationCompletionListener, AutoCloseable {
    interface Params extends BuildServiceParameters {
        RegularFileProperty getOutputFile()
        ListProperty<String> getRequiredTasks()
        Property<String> getInvocationId()
    }

    private final List<Map> outcomes = Collections.synchronizedList([])
    private final long start = System.currentTimeMillis()

    @Override
    void onFinish(FinishEvent event) {
        if (!(event instanceof TaskFinishEvent)) return
        String path = event.descriptor.taskPath
        if (!(path in parameters.requiredTasks.get())) return
        def result = event.result
        Map item = [path: path, start: result.startTime, end: result.endTime]
        if (result instanceof TaskSuccessResult) {
            item.outcome = result.fromCache ? 'FROM-CACHE' : result.upToDate ? 'UP-TO-DATE' : 'EXECUTED'
        } else if (result instanceof TaskSkippedResult) {
            item.outcome = 'SKIPPED'
            item.skipMessage = result.skipMessage
        } else if (result instanceof TaskFailureResult) {
            item.outcome = 'FAILED'
        } else {
            item.outcome = 'UNKNOWN'
        }
        outcomes.add(item)
    }

    @Override
    void close() {
        List<Map> entries = new ArrayList<>(outcomes).sort { it.path }
        def expected = new ArrayList<>(parameters.requiredTasks.get()).sort()
        boolean passed = entries*.path == expected && entries.every { it.outcome == 'EXECUTED' }
        Map evidence = [schema: 'jmlx-task-evidence-1', invocationId: parameters.invocationId.get(),
                start: start, end: System.currentTimeMillis(), passed: passed, tasks: entries]
        File output = parameters.outputFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(JsonOutput.prettyPrint(JsonOutput.toJson(evidence)) + '\n', 'UTF-8')
        if (!passed) throw new GradleException('Required release tests did not execute; see task evidence')
    }
}

class ReleaseEvidencePlugin implements Plugin<Project> {
    private final BuildEventsListenerRegistry registry

    @Inject
    ReleaseEvidencePlugin(BuildEventsListenerRegistry registry) { this.registry = registry }

    @Override
    void apply(Project project) {
        def service = project.gradle.sharedServices.registerIfAbsent('jmlxReleaseTaskEvidence', ReleaseTaskEvidence) {
            parameters.outputFile.set(new File(project.providers.gradleProperty('releaseEvidenceFile').get()))
            parameters.requiredTasks.set(project.providers.gradleProperty('releaseRequiredTasks').get().split(',').toList())
            parameters.invocationId.set(project.providers.gradleProperty('releaseInvocationId').get())
        }
        registry.onTaskCompletion(service)
    }
}

gradle.beforeProject { project ->
    if (project == project.rootProject) project.pluginManager.apply(ReleaseEvidencePlugin)
}
