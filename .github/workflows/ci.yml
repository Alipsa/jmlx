# One workflow coordinates the non-native and native checks. The pure-Java job
# covers jmlx-jinja/jmlx-tokenizer and their Node-oracle verification; the
# macOS job covers the MLX-dependent modules. Keeping them separate jobs avoids
# repeating the Jinja suite on the expensive macOS ARM64 runner.
#
# The Node-dependent tasks (see jmlx-jinja/build.gradle's nodeDependentTasks list) require the
# exact Node version pinned in jmlx-jinja/upstream/upstream-lock.json and are not wired into
# `check` for that reason; this workflow is what actually runs them, since jmlx-jinja was
# migrated from the archived standalone hfjinja repo where they ran in its own CI.
name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # node-version-file rather than a literal: jmlx-jinja/.nvmrc is the same file a
      # developer's `nvm use` reads, so CI and local runs cannot drift apart. Its value is
      # still checked against upstream/upstream-lock.json's nodeVersion by nodeOracleVersion.
      - uses: actions/setup-node@v7
        with:
          node-version-file: jmlx-jinja/.nvmrc

      - uses: gradle/actions/setup-gradle@v6

      - name: Check shared build logic
        run: ./gradlew -p buildSrc check

      # Root `check` owns repository-wide verification (currently the generated MLX inventory).
      # Module checks below do not execute it, so invoke it explicitly rather than assuming a
      # module lifecycle task covers handwritten source across the repository.
      - name: Run root verification
        run: ./gradlew check

      # Configuration cache is off repo-wide (see gradle.properties) because of
      # diffplug/spotless#2850, so no --no-configuration-cache flag is needed here.
      - name: Run jmlx-jinja/jmlx-tokenizer check and Node-oracle differential verification
        run: |
          ./gradlew \
            :jmlx-jinja:check \
            :jmlx-tokenizer:check \
            :jmlx-jinja:nodeCorpusTest \
            :jmlx-jinja:nodeOracleVersion \
            :jmlx-jinja:nodeCorpusVerify \
            :jmlx-jinja:corpusCoverage \
            :jmlx-jinja:astSnapshotVerify \
            :jmlx-jinja:fuzzParserTest \
            :jmlx-jinja:fuzzParserVerify \
            :jmlx-jinja:formatGoldenVerify

  native:
    # macos-26 is GitHub's hosted ARM64 (M1) image. Each job starts on a
    # fresh VM, so the pinned MLX runtime must be bootstrapped in the checkout.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64

      - uses: gradle/actions/setup-gradle@v6

      - name: Bootstrap pinned MLX runtime
        shell: bash
        run: ./scripts/bootstrap-native.sh

      - name: Run root verification
        run: ./gradlew check

      # The Java job already verifies jmlx-jinja/jmlx-tokenizer. Do not use
      # Gradle's build cache here: a cached test result would not demonstrate
      # that MLX tests executed on this Apple-Silicon runner.
      - name: Run native module checks
        run: ./gradlew --no-build-cache :jmlx-ffi:check :jmlx-core:check :jmlx-models:check :jmlx-examples:check :jmlx-native-macos-arm64:check :jmlx-ffi:assemble :jmlx-core:assemble :jmlx-models:assemble :jmlx-native-macos-arm64:assemble
