# TEMPORARY: generates the Qwen3 Tier-A goldens (plan item 4) and uploads them as
# an artifact for a local, reviewed commit. Delete this workflow once the
# goldens are committed; it is workflow_dispatch-only and never runs in CI.
name: "Temp: generate qwen3 goldens"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen3-goldens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The provenance pins the exact interpreter (3.12.3) that produced the
      # existing goldens; match it so only the new files change.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'

      - name: Install hash-locked reference environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r tools/hf-reference/requirements.lock

      - name: Generate qwen3 model golden
        env:
          HF_HUB_OFFLINE: '1'
        run: .venv/bin/python tools/hf-reference/generate.py --family qwen3 --out tools/hf-reference/goldens

      - name: Generate qwen3 chat golden
        env:
          HF_HUB_OFFLINE: '1'
        run: .venv/bin/python tools/hf-reference/generate.py --chat --family qwen3 --out tools/hf-reference/goldens

      - name: Assert pre-existing goldens are byte-identical
        run: |
          git diff --exit-code \
            -- tools/hf-reference/goldens \
            ':!tools/hf-reference/goldens/qwen3.json' \
            ':!tools/hf-reference/goldens/checkpoints/qwen3' \
            ':!tools/hf-reference/goldens/chat-qwen3.json'

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-goldens
          path: |
            tools/hf-reference/goldens/qwen3.json
            tools/hf-reference/goldens/checkpoints/qwen3
            tools/hf-reference/goldens/chat-qwen3.json
            tools/hf-reference/provenance.json
