plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'maven-publish'
}

// Own explicit line, independent of the root's 0.5.0-SNAPSHOT default going forward -- see
// req/plans/native-artifact-packaging-plan.md. Same number it already carries via that default.
version = '0.5.0-SNAPSHOT'

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('jar') {
    manifest.attributes('Automatic-Module-Name': 'se.alipsa.jmlx.core')
}

// The root's reactive maven-publish wiring turns on Javadoc -Werror for every publishable module.
// Unlike jmlx-ffi's fix (excluding generated code with no doc comments at all), jmlx-core's public
// surface already carries a real prose summary on nearly every element; -Werror's "missing"
// doclint category was only ever flagging absent @param/@return/enum-constant tags on
// self-explanatory parameters (MLXArray a, int axis, int[] shape, ...) -- writing "@param a the
// array" filler for ~100 of these would be pure noise, not real documentation. Disabling only the
// "missing" doclint category keeps -Werror gating genuine problems (broken @link, malformed HTML)
// while not demanding tag-completeness this codebase never enforced before.
tasks.named('javadoc', Javadoc) {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

dependencies {
    // A consumer opts into jmlx-native-macos-arm64 explicitly at runtime: keeping this optional
    // avoids forcing an Apple-Silicon-only ~180MB artifact on users of the Java API (Decision 5 in
    // req/plans/native-artifact-packaging-plan.md).
    // Not exposed on jmlx-core's own public API (MLXArray/MLX wrap raw
    // MemorySegment handles behind plain Java types), so implementation
    // rather than api. Published as a runtime-scope POM dependency, so a
    // consumer of jmlx-core gets jmlx-ffi automatically without adding it
    // themselves.
    implementation project(':jmlx-ffi')

    testImplementation testFixtures(project(':jmlx-ffi'))
    testImplementation libs.jackson.databind
    testFixturesImplementation libs.jackson.databind
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'jmlx-core'
                description = 'Idiomatic Java 25 tensor operations and se.alipsa.jmlx.nn neural network modules for Apple Silicon MLX. Requires a native runtime: clone the repo and run scripts/bootstrap-native.sh, set jmlx.library.path/JMLX_LIBRARY_PATH yourself, or add se.alipsa:jmlx-native-macos-arm64 as a runtime dependency. Consumers must also pass --enable-native-access=ALL-UNNAMED on their own JVM.'
                url = 'https://github.com/Alipsa/jmlx'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        id = 'pernyfelt'
                        name = 'Per Nyfelt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Alipsa/jmlx.git'
                    developerConnection = 'scm:git:ssh://git@github.com:Alipsa/jmlx.git'
                    url = 'https://github.com/Alipsa/jmlx'
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    mustRunAfter rootProject.tasks.named('generateMlxOracleFixtures')
    systemProperty 'jmlx.repository.root', rootProject.projectDir.absolutePath
    inputs.files(rootProject.fileTree('tools/mlx-oracle/fixtures') { include '*.json' })
    // Opt-in performance tests: ./gradlew :jmlx-core:test -Djmlx.benchmark=true --tests "*Benchmark*"
    systemProperty 'jmlx.benchmark', System.getProperty('jmlx.benchmark', 'false')
}

// Exact float32 reference comparisons run separately from default-precision inference tests.
// Tag new strict references with full-float32 so the mode is enforced before MLX initializes.
tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'full-float32' }
    environment 'MLX_ENABLE_TF32', '1'
    inputs.property('mlxEnableTf32', '1')
}

tasks.register('float32GoldenTest', Test) {
    group = 'verification'
    description = 'Verifies tagged attention and MoE float32 references in a full-precision JVM.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'full-float32' }
    environment 'MLX_ENABLE_TF32', '0'
    inputs.property('mlxEnableTf32', '0')
    mustRunAfter tasks.named('test')
}

tasks.named('check') { dependsOn tasks.named('float32GoldenTest') }

// Internal reader variants must never appear in published POM/module metadata.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }
tasks.register('verifyPublishedDependencies') {
    group = 'verification'
    dependsOn 'generatePomFileForMavenPublication', 'generateMetadataFileForMavenPublication'
    def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml')
    def metadataFile = layout.buildDirectory.file('publications/maven/module.json')
    inputs.files(pomFile, metadataFile)
    doLast {
        def expected = ["se.alipsa:jmlx-ffi:${project(':jmlx-ffi').version}"]
        def actual = se.alipsa.jmlx.buildsrc.PublishedPomDependencies.read(pomFile.get().asFile)
                .collect { it.coordinates() }
        if (actual != expected) { throw new GradleException("Core POM dependencies changed: ${actual}") }
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile.get().asFile)
        if (metadataFile.get().asFile.text.contains('test-fixtures') ||
                metadataFile.get().asFile.text.contains('testFixtures')) {
            throw new GradleException('Core publication leaked test fixtures')
        }
        metadata.variants.each { variant ->
            def deps = (variant.dependencies ?: []).collect { "${it.group}:${it.module}:${it.version.requires}" }
            def wanted = variant.name == 'runtimeElements' ? expected : []
            if (deps != wanted) { throw new GradleException("Core metadata dependencies changed: ${variant.name}: ${deps}") }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyPublishedDependencies') }

// One selected class per launcher invocation; potentially fatal native paths never share test JVMs.
tasks.named('test', Test) { exclude '**/Phase71*Probe.class' }
tasks.named('float32GoldenTest', Test) { exclude '**/Phase71*Probe.class' }
tasks.register('phase71NativeProbe', Test) {
    group = 'verification'
    description = 'Internal evidence task; invoke scripts/run-phase71-native-probes.sh.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/Phase71*Probe.class'
    useJUnitPlatform()
    environment 'MLX_ENABLE_TF32', '0'
    inputs.property('mlxEnableTf32', '0')
}
