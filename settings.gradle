plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

pluginManagement {
    // Local testing of nexus-release-plugin changes: point at a plugin checkout. Production
    // releases resolve the plugin exclusively from the Gradle Plugin Portal so a locally
    // published build can never replace the released version. See tools/release-all/README.md.
    if (providers.gradleProperty('releaseAllPluginDir').isPresent()) {
        includeBuild(providers.gradleProperty('releaseAllPluginDir').get())
    }
    repositories {
        if (providers.gradleProperty('releaseAllMode').isPresent()) {
            exclusiveContent {
                forRepository { gradlePluginPortal() }
                filter {
                    includeGroup 'se.alipsa.gradle'
                    includeGroup 'se.alipsa.nexus-release-plugin'
                }
            }
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'jmlx'
include(
    'jmlx-ffi',
    'jmlx-core',
    'jmlx-tokenizer',
    'jmlx-jinja',
    'jmlx-models',
    'jmlx-vision',
    'jmlx-examples',
    'jmlx-benchmarks',
    'jmlx-native-macos-arm64')
