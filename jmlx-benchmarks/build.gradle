plugins {
    id 'application'
}

dependencies {
    implementation project(':jmlx-core')
    implementation project(':jmlx-models')
    implementation libs.jackson.databind
}

application {
    mainClass = 'se.alipsa.jmlx.benchmarks.Tf32Benchmark'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('run', JavaExec).configure {
    workingDir rootProject.projectDir
    systemProperty('jmlx.library.path',
            rootProject.layout.projectDirectory.dir('native/install/lib').asFile.absolutePath)
}

tasks.register('benchmarkTf32', JavaExec) {
    group = 'benchmark'
    description = 'Compares TF32 enabled and disabled in alternating fresh JVMs (pass --args).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    workingDir rootProject.projectDir
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty('jmlx.library.path',
            rootProject.layout.projectDirectory.dir('native/install/lib').asFile.absolutePath)
}

tasks.register('benchmarkBaseline', JavaExec) {
    group = 'benchmark'
    description = 'Runs the phase 8.2 decode-baseline launcher (pass --args <spec.json>).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'se.alipsa.jmlx.benchmarks.BaselineBenchmark'
    workingDir rootProject.projectDir
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty('jmlx.library.path',
            rootProject.layout.projectDirectory.dir('native/install/lib').asFile.absolutePath)
    // The launcher forks the Java worker from the models module's test runtime classpath
    // (BaselineWorker is a test-class, deliberately not a published API); the spec may name
    // it with the "@models-test" alias, which the launcher resolves through this property.
    systemProperty('jmlx.baseline.models.test.classpath',
            project(':jmlx-models').sourceSets.test.runtimeClasspath.asPath)
    // Binding-count Java workers run the jmlx-core binding agent as a -javaagent of the
    // forked JVM; the launcher resolves it through this property, and a spec with a
    // binding-count worker but no property fails validation (the gate fails loudly).
    systemProperty('jmlx.baseline.binding.agent.jar',
            project(':jmlx-core').tasks.named('bindingAgent').get().archiveFile.get().asFile.absolutePath)
    // The runtime classpath includes the test-fixtures jars (jmlx-ffi's are published into the
    // classpath via testFixtures), so depend on the FileCollection itself, not just testClasses.
    dependsOn project(':jmlx-models').sourceSets.test.runtimeClasspath
    dependsOn project(':jmlx-core').tasks.named('bindingAgent')
}

tasks.register('benchmarkVlmFirstUse', JavaExec) {
    group = 'benchmark'
    description = 'Runs the phase 8.2 WP4 both-pin, both-VLM first-inference launcher ' +
            '(pass --args <spec.json>; each worker forks from its own tree installDist and staged native lib).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'se.alipsa.jmlx.benchmarks.VlmFirstUseBenchmark'
    workingDir rootProject.projectDir
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    dependsOn tasks.named('installDist')
}

tasks.register('benchmarkFfmCalibration', JavaExec) {
    group = 'benchmark'
    description = 'Builds the no-op FFM calibration dylib under the output directory (cc -shared ' +
            '-O2; a machine without cc fails with a clear error) and measures the downcall ' +
            'transition cost of representative generated-binding shapes in fresh JVMs (pass --args ' +
            'output-directory [iterations calls forks warmup], defaults 200 2000 5 2000).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'se.alipsa.jmlx.benchmarks.FfmCalibration'
    workingDir rootProject.projectDir
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}
