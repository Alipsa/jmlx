plugins { id 'java' }

// Resolves the same graph through the POMs only (see repositories.gradle) so a Maven consumer's view
// is exercised too. The jmlx-core POM puts jmlx-ffi in runtime scope (it is an `implementation`
// dependency), so only the RUNTIME classpath is comparable, never the compile classpath. The toolchain
// (21 pure / 25 full) and the selected entry dependencies come from smoke-conventions.gradle.
ext.pomOnlyResolution = true
apply from: '../repositories.gradle'
apply from: '../smoke-conventions.gradle'

smokeRegisterPomTask()
