plugins {
    id 'java-library'
    id 'maven-publish'
}

// Fresh line -- jmlx-models has never been published, same reasoning jmlx-tokenizer used for its
// own first version. Independent of the root's 0.5.0-SNAPSHOT and of jmlx-core/jmlx-ffi's own
// (older, phase 1-4) version line -- see req/plans/native-artifact-packaging-plan.md.
version = '0.1.0-SNAPSHOT'

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('jar') {
    manifest.attributes('Automatic-Module-Name': 'se.alipsa.jmlx.models')
}

// Same reasoning as jmlx-core's own build.gradle: -Werror's "missing" doclint category only ever
// flagged absent @param/@return/@throws tags on already-prose-documented, self-explanatory
// parameters -- not a real content problem worth a wave of filler tags.
tasks.named('javadoc', Javadoc) {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

sourceSets {
    tierB {
        java.srcDir 'src/tierB/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output +
                sourceSets.test.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.test.runtimeClasspath
    }
    // Phase 7.3a WP5: the opt-in exact-bit recorder/comparator. Like tierB it sits outside
    // main/test, on top of the test outputs so it can reuse package-private test helpers and
    // drive package-private model steps (stepLogits). It is compiled by check (via
    // checkstyleExactBits) so contributors always get it compiling, but never run except by the
    // opt-in exactBits* tasks below.
    exactBits {
        java.srcDir 'src/exactBits/java'
        compileClasspath += sourceSets.main.output + sourceSets.test.output +
                sourceSets.test.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.test.runtimeClasspath
    }
}

dependencies {
    testImplementation testFixtures(project(':jmlx-core'))
    api project(':jmlx-core')
    api project(':jmlx-tokenizer')
    // Phase 7.3a: image inputs (SmolVLM/Idefics3) ride on jmlx-vision's processor; models
    // exposes it, so consumers of a future withImages API get it transitively.
    api project(':jmlx-vision')
    implementation libs.jackson.databind

    testImplementation testFixtures(project(':jmlx-ffi'))
    tierBImplementation sourceSets.test.output
    tierBImplementation testFixtures(project(':jmlx-ffi'))
    exactBitsImplementation sourceSets.test.output
    exactBitsImplementation testFixtures(project(':jmlx-ffi'))
}

tasks.register('tierBTest', Test) {
    group = 'verification'
    description = 'Runs opt-in real-checkpoint smoke tests when JMLX_TIER_B_MODEL_DIR is set.'
    doNotTrackState('verifies external pinned checkpoints and measures inference on this host')
    testClassesDirs = sourceSets.tierB.output.classesDirs
    classpath = sourceSets.tierB.runtimeClasspath
    useJUnitPlatform()
    environment 'MLX_ENABLE_TF32', '0'
    inputs.property('mlxEnableTf32', '0')
    def tierBDirectory = System.getenv('JMLX_TIER_B_MODEL_DIR')
    systemProperty 'jmlx.tier.b.model.dir', tierBDirectory ? rootProject.file(tierBDirectory).absolutePath : ''
    systemProperty 'jmlx.tier.b.expected.model.type', System.getenv('JMLX_TIER_B_MODEL_TYPE') ?: ''
    def tierBManifest = System.getenv('JMLX_TIER_B_MANIFEST')
    def taskName = tierBManifest && rootProject.file(tierBManifest).isFile()
        ? new groovy.json.JsonSlurper().parse(rootProject.file(tierBManifest)).task ?: 'generation'
        : 'generation'
    def suites = [generation: 'TierBSmokeTest', embedding: 'TierBEmbeddingTest',
                  classification: 'TierBClassificationTest', seq2seq: 'TierBSeq2SeqTest']
    if (!suites.containsKey(taskName)) { throw new GradleException("Unsupported Tier-B task: ${taskName}") }
    def assertedTask = System.getenv('JMLX_TIER_B_TASK')
    if (assertedTask && assertedTask != taskName) {
        throw new GradleException("Expected Tier-B task ${assertedTask}, got ${taskName}")
    }
    include "**/${suites[taskName]}.class"
    inputs.property('tierBTask', taskName)
    if (tierBManifest) { inputs.file(rootProject.file(tierBManifest)) }
    systemProperty 'jmlx.tier.b.expected.task', System.getenv('JMLX_TIER_B_TASK') ?: ''
    systemProperty 'jmlx.tier.b.manifest', tierBManifest ? rootProject.file(tierBManifest).absolutePath : ''
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'jmlx-models'
                description = 'Local Hugging Face Llama, Qwen2, Qwen3, Mistral, Gemma, Phi-3 and Mixtral safetensors decoder loading and seeded generation on jmlx-core.'
                url = 'https://github.com/Alipsa/jmlx'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit'
                    }
                }
                developers {
                    developer {
                        id = 'pernyfelt'
                        name = 'Per Nyfelt'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Alipsa/jmlx.git'
                    developerConnection = 'scm:git:ssh://git@github.com:Alipsa/jmlx.git'
                    url = 'https://github.com/Alipsa/jmlx'
                }
            }
        }
    }
}

// jmlx-tokenizer's own verifyPublishedDependencies is the precedent this mirrors: jmlx-models
// legitimately has non-trivial published dependencies, so this asserts their exact identity
// rather than (like jmlx-jinja) asserting there are none.
tasks.register('verifyPublishedDependencies') {
    group = 'verification'
    description = 'Verifies the published POM declares exactly the expected dependencies.'
    dependsOn tasks.named('generatePomFileForMavenPublication')
    def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml')
    def expected = [
            'se.alipsa:jmlx-core',
            'se.alipsa:jmlx-tokenizer',
            'se.alipsa:jmlx-vision',
            'tools.jackson.core:jackson-databind',
    ]
    inputs.file(pomFile)
    inputs.property('expected', expected)
    doLast {
        def actual = se.alipsa.jmlx.buildsrc.PublishedPomDependencies.read(pomFile.get().asFile)
                .collect { it.groupArtifact() }
        if (actual.toSorted() != expected.toSorted()) {
            throw new GradleException(
                    "Published dependencies changed. Expected ${expected.toSorted()}, " +
                    "found ${actual.toSorted()}.")
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyPublishedDependencies') }

tasks.withType(Test).configureEach {
    mustRunAfter rootProject.tasks.named('generateMlxOracleFixtures')
    systemProperty 'jmlx.repository.root', rootProject.projectDir.absolutePath
    inputs.files(rootProject.fileTree('tools/mlx-oracle/fixtures') { include '*.json' })
    inputs.files(rootProject.fileTree('tools/hf-reference/goldens'))
}

// Gate 0 thread probes (req/plans/phase6-5-plan.md). Each runs in its own forked JVM, like
// jmlx-ffi's loaderGuardTest: probe (a) needs a JVM in which no other test has used MLX on a
// thread first, so "another thread used MLX before the worker" is really first, and probe (b)
// races two threads on their own thread-owned streams and may crash its JVM, so it must not share
// one with (a), with `test`, or with `check`.
def threadProbeClasses = ['**/WorkerStreamProbeTest.class', '**/ConcurrentStreamProbeTest.class']

// CPU float32 references need full native precision. Keep them in a separate JVM so the
// ordinary suite still covers MLX's default reduced-precision inference paths. Batch-step
// equivalence runs in both tasks, exercising its strict and default-mode bounds separately.
tasks.named('test', Test) {
    exclude threadProbeClasses
    useJUnitPlatform { excludeTags 'full-float32' }
    environment 'MLX_ENABLE_TF32', '1'
    inputs.property('mlxEnableTf32', '1')
}

tasks.register('float32GoldenTest', Test) {
    group = 'verification'
    description = 'Verifies CPU float32 model goldens and strict batch equivalence in a full-precision JVM.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'full-float32', 'batch-equivalence' }
    environment 'MLX_ENABLE_TF32', '0'
    inputs.property('mlxEnableTf32', '0')
    // MLX supports one active thread per process. Run the two precision tasks sequentially
    // to avoid GPU contention, while allowing this task to be invoked independently.
    mustRunAfter tasks.named('test')
}

// Phase 7.3a WP5: opt-in exact-bit recorder/comparator for the decoder-embedding refactor
// (req/plans/phase7-3a-plan.md section 9). Each task forks its own JVM with an explicit
// MLX_ENABLE_TF32, mirroring the test/float32GoldenTest split (1 = default reduced precision,
// 0 = full float32). Recordings are PR evidence under build/exact-bits (never committed); the
// tasks write and read files outside their declared outputs, so they never track state.
// Deliberately NOT part of check or build: they are baseline evidence, run manually before
// (record) and after (verify) the refactor.
def exactBitsBaseDir = layout.buildDirectory.get().dir('exact-bits').asFile.absolutePath
def configureExactBitsTest = { Test task, String tf32, String mode, String purpose ->
    task.group = 'verification'
    task.description = "Opt-in exact-bit recorder/comparator, ${purpose}, MLX_ENABLE_TF32=${tf32} " +
            "(1 = default reduced precision, 0 = full float32). Recordings live under " +
            "build/exact-bits/tf32-${tf32}/; never part of check."
    task.doNotTrackState('opt-in exact-bit tool; recordings are PR evidence files, not build outputs')
    task.testClassesDirs = sourceSets.exactBits.output.classesDirs
    task.classpath = sourceSets.exactBits.runtimeClasspath
    task.useJUnitPlatform()
    task.environment 'MLX_ENABLE_TF32', tf32
    task.inputs.property('mlxEnableTf32', tf32)
    task.systemProperty 'jmlx.exact.bits.mode', mode
    task.systemProperty 'jmlx.exact.bits.dir', exactBitsBaseDir
    task.mustRunAfter tasks.named('test'), tasks.named('float32GoldenTest')
}

tasks.register('exactBitsRecordTf32On', Test) {
    configureExactBitsTest(delegate, '1', 'record', 'records the baseline')
}

tasks.register('exactBitsRecordTf32Off', Test) {
    configureExactBitsTest(delegate, '0', 'record', 'records the baseline')
    mustRunAfter 'exactBitsRecordTf32On'
}

tasks.register('exactBitsVerifyTf32On', Test) {
    configureExactBitsTest(delegate, '1', 'verify', 'verifies against the recorded baseline')
}

tasks.register('exactBitsVerifyTf32Off', Test) {
    configureExactBitsTest(delegate, '0', 'verify', 'verifies against the recorded baseline')
    mustRunAfter 'exactBitsVerifyTf32On'
}

// Sequential per mode pair: MLX allows one active thread per process, and the two precision
// modes must not contend for the GPU mid-recording.
tasks.register('exactBitsRecord') {
    group = 'verification'
    description = 'Opt-in: records exact float bits and greedy IDs for every Tier-A decoder family ' +
            'and quantized variant in both TF32 modes (build/exact-bits/tf32-1 and tf32-0). ' +
            'Never part of check; run before the refactor it guards.'
    doNotTrackState('lifecycle task over the two opt-in record tasks')
    dependsOn 'exactBitsRecordTf32On', 'exactBitsRecordTf32Off'
}

tasks.register('exactBitsVerify') {
    group = 'verification'
    description = 'Opt-in: recomputes the exact-bit captures in both TF32 modes and requires ' +
            'bit-exact agreement with build/exact-bits (metadata may differ only in git commit). ' +
            'Never part of check; run after the refactor it guards.'
    doNotTrackState('lifecycle task over the two opt-in verify tasks')
    dependsOn 'exactBitsVerifyTf32On', 'exactBitsVerifyTf32Off'
}

tasks.register('threadProbeTest', Test) {
    group = 'verification'
    description = 'Gate 0 probe (a): a worker thread uses MLX after the stream was initialized ' +
            'elsewhere. Required; runs in its own JVM.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/WorkerStreamProbeTest.class'
}

// Evidence only: a pass proves nothing and it can crash its JVM, so it is deliberately not wired
// into `check`. CI runs it as its own continue-on-error step and records the outcome.
tasks.register('concurrentStreamProbe', Test) {
    group = 'verification'
    description = 'Gate 0 probe (b): two threads use MLX concurrently. Evidence only, never gates.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ConcurrentStreamProbeTest.class'
}

tasks.named('check') {
    dependsOn tasks.named('threadProbeTest'), tasks.named('float32GoldenTest')
}
