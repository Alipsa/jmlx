# The core/ffi tests need the MLX dylibs and metallib on Apple Silicon.
# macos-26 is GitHub's hosted ARM64 (M1) image, and every job starts on a
# fresh VM, so bootstrap the pinned runtime in the checkout before testing.
name: Native CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64

      # jmlx-jinja's release-verification tests invoke Node directly and
      # validate this exact version against upstream/upstream-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version-file: jmlx-jinja/.nvmrc

      - uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap pinned MLX runtime
        shell: bash
        run: ./scripts/bootstrap-native.sh

      - name: Run full native build
        run: ./gradlew build
