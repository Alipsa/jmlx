// Independent of the jmlx checkout: no project(...) dependencies, no includeBuild, no buildSrc.
// Run via run.sh, which publishes the six modules to a disposable repository first.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'release-smoke'
include 'app', 'pom-check'
