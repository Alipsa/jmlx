/*
 * Root build script. Config shared by jmlx-ffi, jmlx-core, jmlx-tokenizer,
 * jmlx-jinja and jmlx-examples lives here; each module's own build.gradle only
 * declares its plugin and dependencies. See req/initial-plan.md §4 for the
 * rationale behind the native-access flags and the native-directory system
 * property below.
 */

plugins {
    id 'com.diffplug.spotless' version '8.9.0' apply false
    id 'se.alipsa.nexus-release-plugin' version '2.2.0' apply false
}

allprojects {
    group = 'se.alipsa'
    version = '0.5.0-SNAPSHOT'
}

// mavenLocal() is only added when the jmlx project's own version (above) is a -SNAPSHOT
// build -- the expected setup for resolving a locally-built, unreleased dependency during
// local development, not a build-hygiene concern. A real release build resolves every
// dependency from mavenCentral() alone, so a stale same-GAV artifact sitting in
// ~/.m2/repository can never silently win over Central with no diagnostic (see PR #14 review).
allprojects {
    repositories {
        mavenCentral()
        if (rootProject.version.toString().endsWith('-SNAPSHOT')) {
            mavenLocal()
        }
    }
}

// Read via the explicit VersionCatalogsExtension API, not the `libs.versions.x` generated
// accessor: referencing that accessor from a root-script subprojects{} closure is an
// implicit parent-project property lookup, deprecated as of Gradle 9.7 and an error in
// Gradle 10 (see useJUnitJupiter below). orElseThrow with a message beats the bare .get()'s
// context-free NoSuchElementException if the catalog alias is ever renamed.
def junitJupiterVersion =
    rootProject.extensions
        .getByType(VersionCatalogsExtension)
        .named('libs')
        .findVersion('junit.jupiter')
        .orElseThrow(
            () ->
                new IllegalStateException(
                    "build.gradle: no 'junit.jupiter' version alias in gradle/libs.versions.toml"))
        .requiredVersion

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Style: 2-space indent, 100-column width, Google Java Style, enforced by
    // running google-java-format directly (no separate Spotless config file --
    // see config/checkstyle/checkstyle.xml for the checkstyle side, which
    // derives from Google's own upstream artifact).
    checkstyle {
        toolVersion = '13.10.0'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    }

    // jmlx-ffi/src/main/generated/java is committed jextract output, not
    // hand-written -- scripts/regen-bindings.sh is the only thing allowed to
    // touch it, and req/initial-plan.md's bindings-drift check asserts it
    // stays byte-identical to that output. Spotless never sees it because
    // its `target` below only globs src/main/java, not .../generated/java;
    // jmlx-ffi/build.gradle does the equivalent for checkstyleMain, since
    // that generated dir is registered as an extra source root there.
    spotless {
        java {
            target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'src/testFixtures/java/**/*.java'
            importOrder()
            removeUnusedImports()
            googleJavaFormat('1.28.0').reflowLongStrings()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    testing {
        suites {
            test {
                // junitJupiterVersion (above) is read from the same
                // gradle/libs.versions.toml alias jmlx-ffi/build.gradle's
                // testFixturesImplementation uses, via the explicit
                // VersionCatalogsExtension API rather than the generated
                // `libs.versions.x` accessor -- see that variable's own
                // comment for why the accessor itself can't be used here.
                useJUnitJupiter(junitJupiterVersion)
            }
        }
    }

    // useJUnitJupiter above adds org.junit.platform:junit-platform-launcher
    // to testRuntimeOnly without an explicit version, relying on
    // org.junit:junit-bom for version alignment; that alignment is not
    // guaranteed to succeed in every environment (e.g. a mavenLocal() cache
    // holding only junit-bom's .pom with no Gradle Module Metadata .module
    // file resolves it to an empty version instead). Pinning it explicitly
    // to the same catalog-sourced version as useJUnitJupiter above sidesteps
    // that lookup entirely and keeps both in sync from one source of truth --
    // but this reuse is only valid because JUnit 6 unified Jupiter's and the
    // Platform's version numbers onto one release train. If the catalog's
    // junit.jupiter alias is ever pinned back to a pre-6.0 (5.x) version,
    // this line would request a junit-platform-launcher:5.x.y that does not
    // exist; a genuine version split would need its own catalog alias here.
    dependencies {
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitJupiterVersion}"
    }

    // req/initial-plan.md §4: an absolute path, since native/install/lib is
    // CWD-relative and resolves differently under :jmlx-core:test, an IDE
    // run, and :jmlx-examples:run. Computing the path string here touches no
    // filesystem state (no exists() check), so it stays safe if
    // org.gradle.configuration-cache is ever re-enabled (see gradle.properties --
    // it's off today for an unrelated Spotless/config-cache bug, not because of
    // anything here) -- only NativeLoader's own resolution, at JVM execution
    // time, decides whether the directory is actually usable.
    def nativeLibDir = rootProject.layout.projectDirectory.dir('native/install/lib').asFile.absolutePath

    tasks.withType(Test).configureEach {
        // --enable-native-access=ALL-UNNAMED: the check applies to the
        // immediate caller's module. Everything here runs unnamed/classpath
        // for now, so every test JVM that might transitively reach a
        // downcall needs this. Once jmlx-ffi is a named JPMS module this
        // narrows to --enable-native-access=se.alipsa.jmlx.ffi.
        jvmArgs('--enable-native-access=ALL-UNNAMED')
        systemProperty('jmlx.library.path', nativeLibDir)
    }
}

// Release wiring for publishable modules only. A module opts in by applying 'maven-publish';
// jmlx-core/jmlx-ffi/jmlx-examples do not, and are unaffected. Kept here rather than duplicated
// per module so there is one copy to keep correct -- the same reason Spotless is applied above.
subprojects {
    plugins.withId('maven-publish') {
        apply plugin: 'signing'
        apply plugin: 'se.alipsa.nexus-release-plugin'

        // The 'maven' publication is declared in the module's own build.gradle, which Gradle
        // evaluates after this block runs, so the publication cannot be referenced eagerly here.
        afterEvaluate {
            // Guarded lookup, not publishing.publications.maven: a future module that applies
            // 'maven-publish' but names its publication something else would otherwise hit an
            // UnknownDomainObjectException here at configuration time, breaking `./gradlew build`
            // for the *whole* repo with an error pointing at this root script instead of at the
            // module that actually needs fixing.
            def mavenPub = publishing.publications.findByName('maven')
            if (mavenPub == null) {
                throw new GradleException(
                        "Project '${project.path}' applies 'maven-publish' but has no publication " +
                        "named 'maven'. Name it 'maven' (see jmlx-jinja/build.gradle or " +
                        "jmlx-tokenizer/build.gradle for the expected shape) so this root script's " +
                        "signing/nexus-release wiring can find it.")
            }

            // Central rejects unsigned release bundles, but signing must stay inert without a
            // configured key so `check`, the jmlx-jinja CI workflow, and releaseVerification all
            // remain keyless. Making this unconditional would break all three.
            signing {
                required = providers.gradleProperty('signing.keyId').present
                sign mavenPub
            }

            nexusReleasePlugin {
                userName = providers.gradleProperty('sonatypeUsername').orNull
                password = providers.gradleProperty('sonatypePassword').orNull
                mavenPublication = mavenPub
            }
        }

        // Central rejects a SNAPSHOT release outright -- both a POM that references SNAPSHOT
        // dependencies, and a SNAPSHOT version for the module being released itself. The
        // dependency check is what forces release order: jmlx-tokenizer depends on jmlx-jinja via
        // project(':jmlx-jinja'), which Gradle publishes as a concrete coordinate carrying jinja's
        // current version, so this fails the tokenizer release while jinja is still a SNAPSHOT.
        // The own-version check exists because nothing on the Gradle side otherwise catches it:
        // the nexus-release-plugin's ReleaseTask just logs and returns 0 for a SNAPSHOT version,
        // so a bare `./gradlew :module:release` would report BUILD SUCCESSFUL having published
        // nothing -- only release.sh's shell-level check caught that before this task did.
        tasks.register('verifyNoSnapshotDependencies') {
            // `project.name`/`project.version` are read here -- at configuration time, inside
            // this registration block -- rather than from `project` inside `doLast`: `Task.project`
            // is deprecated at execution time, unsupported under the configuration cache, and a
            // hard error in Gradle 10. This has to be `project.name`/`project.version` rather than
            // the bare `name`/`version` a plain project-level script statement could use, because
            // this closure's delegate is the *task* being registered, which shadows the project's
            // own `name` property with the task's own name ('verifyNoSnapshotDependencies') --
            // and it has to happen inside this lazily-realized block, not at the enclosing
            // plugins.withId('maven-publish') level, which runs as soon as the module applies the
            // plugin, i.e. before the module's own `version = ...` line executes, and would
            // silently capture the root project's inherited version instead of the module's own.
            def moduleName = project.name
            def moduleVersion = project.version.toString()
            group = 'verification'
            description = "Fails if ${moduleName}'s own version, or any dependency in its generated POM, " +
                    'is a -SNAPSHOT.'
            dependsOn tasks.named('generatePomFileForMavenPublication')
            def pomFile = layout.buildDirectory.file('publications/maven/pom-default.xml')
            inputs.file(pomFile)
            doLast {
                if (moduleVersion.endsWith('-SNAPSHOT')) {
                    throw new GradleException(
                            "Cannot release ${moduleName}: its own version (${moduleVersion}) is a SNAPSHOT.")
                }
                def pom = javax.xml.parsers.DocumentBuilderFactory.newInstance()
                        .newDocumentBuilder().parse(pomFile.get().asFile)
                def dependencyNodes = pom.getElementsByTagName('dependency')
                def offenders = []
                for (int i = 0; i < dependencyNodes.length; i++) {
                    def dependency = dependencyNodes.item(i)
                    def field = { String name ->
                        dependency.childNodes.find {
                            it.nodeType == org.w3c.dom.Node.ELEMENT_NODE && it.nodeName == name
                        }?.textContent
                    }
                    if (field('version')?.endsWith('-SNAPSHOT')) {
                        offenders << "${field('groupId')}:${field('artifactId')}:${field('version')}"
                    }
                }
                if (!offenders.isEmpty()) {
                    throw new GradleException(
                            "Cannot release ${moduleName}: POM references SNAPSHOT dependencies: " +
                            "${offenders.join(', ')}. Release those modules first.")
                }
            }
        }

        // `bundle` depends on `publishToMavenLocal`, which installs into ~/.m2 before Central is
        // ever contacted. Without a configured signing key, `signing { required = ... }` above is
        // false, so an unsigned bundle installs locally and only then fails at the Central upload
        // step -- leaving a same-GAV, never-published release version sitting in ~/.m2, exactly the
        // hazard the root build's own mavenLocal() comment warns about (any SNAPSHOT build in this
        // repo resolves mavenLocal() and could silently pick it up). Failing fast, before anything
        // is published anywhere, is cheaper than relying on every release to have credentials
        // configured correctly.
        tasks.register('verifyCentralCredentialsPresent') {
            def moduleName = project.name
            group = 'verification'
            description = 'Fails if Central publishing credentials are missing, before anything is published.'
            doLast {
                def missing = ['signing.keyId', 'sonatypeUsername', 'sonatypePassword']
                        .findAll { !providers.gradleProperty(it).present }
                if (!missing.isEmpty()) {
                    throw new GradleException(
                            "Cannot release ${moduleName}: missing required properties: ${missing.join(', ')}.")
                }
            }
        }

        // release.sh requests `build` and `release` as independent tasks, and Gradle imposes no
        // ordering between independently requested tasks -- without this edge, publishing could
        // begin before verification finished.
        tasks.named('release') {
            dependsOn tasks.named('check'), tasks.named('verifyNoSnapshotDependencies'),
                    tasks.named('verifyCentralCredentialsPresent')
        }

        // dependsOn above only adds edges, it imposes no *order* between them -- so a bare
        // `release` could still run `bundle` (which depends on `publishToMavenLocal`, installing
        // into ~/.m2) before `check`/the guards finish, which is exactly the "stale same-GAV
        // artifact wins silently" mavenLocal() hazard release.sh's own comment warns about.
        // mustRunAfter (not another dependsOn, which would pull `bundle` into `check`'s own task
        // graph) only constrains relative order when both already run together, which `release`'s
        // dependencies guarantee they do.
        tasks.named('bundle') {
            mustRunAfter tasks.named('check'), tasks.named('verifyNoSnapshotDependencies'),
                    tasks.named('verifyCentralCredentialsPresent')
        }
    }
}
